<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--HEAD-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@700&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* 밤하늘 한 장 위에 글자와 가는 선만 놓는 Cosmii 방식. 면·카드 없이 hairline으로 나눔 */
:root{--bg:#060612;--text:rgba(255,255,255,.92);--text70:rgba(255,255,255,.7);--muted:rgba(255,255,255,.64);--faint:rgba(255,255,255,.45);--hair:rgba(255,255,255,.10);--hair2:rgba(255,255,255,.14);--outline:rgba(255,255,255,.4);--gold:#e8c77b;--mint:#6bc5a0;--raised:rgba(22,21,40,.96);--sans:"IBM Plex Sans KR",system-ui,sans-serif;--read:"Gowun Batang","IBM Plex Sans KR",serif;--word:"EB Garamond",Georgia,serif;color-scheme:dark}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--sans);padding-block:12px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));box-sizing:border-box;background-image:radial-gradient(ellipse 600px 420px at 50% 0,rgba(61,217,160,.07),transparent 70%)}
main{max-width:460px;margin:0 auto}
.mast{display:flex;justify-content:space-between;align-items:center;height:48px}
.wm{font:700 20px/24px var(--word);letter-spacing:.3px;color:var(--text70)}
.step{font-size:14px;color:var(--muted)}
.prog{height:1px;background:var(--hair);margin-bottom:28px}.prog i{display:block;height:1px;background:#fff;width:0;transition:width .3s}
h1,h2{margin:0;text-wrap:balance}
h1{font:700 28px/36px var(--sans)}
h2{font:700 21px/32px var(--read)}
.lead{color:var(--muted);margin:12px 0 28px;font-size:15px}
.opts{display:flex;flex-direction:column}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:14px;align-items:center;min-height:44px;padding:16px 0;border-bottom:1px solid var(--hair);font-size:16px;line-height:22px}
.opt:first-child{border-top:1px solid var(--hair)}
.opt:focus-visible{background:rgba(255,255,255,.06);margin:0 -24px;padding-left:24px;padding-right:24px}
.opt:focus-visible{outline:1px solid var(--outline)}
.opt b{width:28px;font:600 15px var(--sans);color:var(--muted);flex:none}
.opt.skip{color:var(--muted)}
.btn{all:unset;box-sizing:border-box;display:block;width:100%;height:52px;line-height:50px;text-align:center;border:1px solid var(--outline);border-radius:12px;font:600 17px/50px var(--sans);cursor:pointer}
.btn:focus-visible{outline:2px solid var(--text)}.btn[disabled]{border-color:var(--hair2);color:var(--faint);cursor:default}
.txt{all:unset;display:block;width:100%;box-sizing:border-box;text-align:center;font-size:15px;color:var(--text70);text-decoration:underline;text-decoration-color:rgba(255,255,255,.3);padding:14px 0;cursor:pointer}
.who{margin:4px 0 0;font:700 15px var(--sans);color:var(--gold)}
.name{font:700 34px/42px var(--read);margin:6px 0 2px}
.book{color:var(--muted);font-size:15px}
.line{font:400 17px/30px var(--read);margin:20px 0}
.pre{color:var(--muted);font-size:15px;margin:0 0 16px}
.rule{border-top:1px solid var(--hair);margin:28px 0}
.sec{font:600 16px/22px var(--sans);letter-spacing:.2px;margin:0 0 4px}
.full{margin:0;padding:14px 0;border-bottom:1px solid var(--hair);font:400 17px/28px var(--read)}.full b{display:block;font:600 14px var(--sans);color:var(--gold);margin-bottom:2px}
.locked p{margin:0;padding:14px 0;border-bottom:1px solid var(--hair);font:400 17px/28px var(--read);color:var(--text);filter:blur(7px);user-select:none}
.mail p.s{font-size:14px;color:var(--muted);margin:0 0 14px}
input[type=email]{width:100%;box-sizing:border-box;height:52px;border:1px solid var(--outline);border-radius:12px;background:transparent;color:var(--text);font:400 16px var(--sans);padding:0 14px;margin:6px 0 14px}
input[type=email]:focus-visible{outline:2px solid var(--text)}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:21px;color:var(--text70);margin:0 0 12px}
.chk input{margin:2px 0 0;width:20px;height:20px;accent-color:#6bc5a0;flex:none}
.chk small{display:block;color:var(--faint);font-size:13px;line-height:19px}
.note{font-size:13px;color:var(--faint);line-height:19px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:inline-flex;gap:9px;align-items:center;max-width:calc(100% - 32px);padding:11px 18px;border-radius:999px;background:var(--raised);border:1px solid var(--hair2);box-shadow:0 8px 16px rgba(0,0,0,.45);font-size:14px}
.toast svg{fill:var(--gold);flex:none}
.proto{font-size:13px;color:var(--faint);border-top:1px solid var(--hair);padding-top:14px;margin-top:40px}
.grid9{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.grid9 .opt{padding-block:14px}.grid9 .opt:nth-child(2){border-top:1px solid var(--hair)}
@media (max-width:360px){.grid9{grid-template-columns:1fr}.grid9 .opt:nth-child(2){border-top:0}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}

/* v2: 퀴즈 전용 — 밤하늘은 그대로, 버튼은 큼직하고 눌리게, 막대는 두껍게 */
body{background-image:radial-gradient(ellipse 520px 380px at 50% -40px,rgba(107,197,160,.16),transparent 70%),radial-gradient(ellipse 380px 300px at 100% 30%,rgba(232,199,123,.07),transparent 70%)}
.prog{height:12px;border-radius:6px;background:rgba(255,255,255,.1);margin-bottom:32px;position:relative}
.prog i{height:12px;border-radius:6px;background:linear-gradient(90deg,#e8c77b,#f3dca3);box-shadow:0 0 14px rgba(232,199,123,.5);position:relative;transition:width .45s cubic-bezier(.2,.9,.2,1)}
.prog i::after{content:"✦";position:absolute;right:-9px;top:-9px;font-size:22px;color:#fff;text-shadow:0 0 10px #e8c77b}
.step{font:600 15px var(--sans);color:var(--text70)}
.wm{font-size:24px;color:var(--text)}
h1{font:700 32px/42px var(--sans);letter-spacing:-.5px}
h2{font:700 25px/36px var(--sans);letter-spacing:-.3px}
.lead{font-size:16px}
.opts{gap:12px}
.opt,.opt:first-child{border:2px solid var(--hair2);border-bottom-width:5px;border-radius:18px;padding:16px 18px;min-height:60px;background:rgba(255,255,255,.04);font:600 17px/24px var(--sans);transition:transform .08s,border-color .15s,background .15s}
.opt b{width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;background:rgba(255,255,255,.08);color:var(--text70);font-size:14px}
.opt:focus-visible{background:rgba(232,199,123,.10);border-color:rgba(232,199,123,.55);margin:0;padding:16px 18px}
.opt:active{transform:translateY(3px);border-bottom-width:2px;margin-top:3px}
.opt.skip{background:transparent;font-weight:400}
.grid9{gap:12px}
.grid9 .opt{min-height:96px;align-items:flex-start;flex-direction:column;gap:10px;font-size:15px;line-height:21px}
.grid9 .opt:nth-child(2){border-top:2px solid var(--hair2)}
.btn{height:60px;line-height:54px;border-radius:18px;border:2px solid var(--gold);border-bottom-width:6px;background:var(--gold);color:#1a1205;font:700 18px/54px var(--sans);transition:transform .08s}
.btn:active{transform:translateY(3px);border-bottom-width:3px}
.btn[disabled]{background:rgba(255,255,255,.08);border-color:var(--hair2);color:var(--faint)}
.slide{animation:in .35s cubic-bezier(.2,.9,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
.big{font-size:84px;line-height:1;color:var(--gold);filter:drop-shadow(0 0 22px rgba(232,199,123,.6));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(4deg)}}
.an{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:36px;gap:22px}
.an .spin{width:84px;height:84px;position:relative;animation:rot 2.4s linear infinite}
.an .spin i{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#a0b4ff;opacity:.9}
@keyframes rot{to{transform:rotate(360deg)}}
.an .msg{font:700 20px/30px var(--sans);min-height:60px}
.an .bar{width:100%;height:12px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.an .bar i{display:block;height:12px;width:0;background:linear-gradient(90deg,#6bc5a0,#e8c77b);border-radius:6px;transition:width 3.6s cubic-bezier(.3,.6,.3,1)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips span{border:1px solid var(--hair2);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text70)}
.name{font:700 40px/48px var(--read);text-align:center;margin:10px 0 4px}
.book{text-align:center;font-size:16px}
.pre{text-align:center}.who{text-align:center}
.line{border:2px solid var(--hair2);border-radius:18px;padding:18px;background:rgba(255,255,255,.04);font:400 18px/30px var(--read);text-align:center}
.locked p{border:2px solid var(--hair);border-radius:14px;padding:14px;margin-bottom:10px}
input[type=email]{height:58px;border-radius:16px;border:2px solid var(--hair2);border-bottom-width:4px;font-size:17px}
.toast{border-radius:999px}
@media (prefers-reduced-motion:reduce){.slide,.big,.an .spin{animation:none}.an .bar i{transition:none}}
.opt b{display:none}.opt{justify-content:flex-start}.grid9 .opt{justify-content:center;min-height:88px;align-items:flex-start;font-size:16px}.opt.skip{justify-content:center;text-align:center}
.opt,.opt:first-child{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.05)}
.opt:focus-visible{background:rgba(232,199,123,.12)}

@media (hover:hover) and (pointer:fine){.opt:hover{background:rgba(232,199,123,.12);border-color:rgba(232,199,123,.55)}}
.fresh .opt{pointer-events:none}
.opt:focus:not(:focus-visible){outline:none}

/* 모션: 보기 차례로 올라오기, 선택 반짝임, 배경 별, 결과 터짐 */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#dde0ff,transparent),radial-gradient(1px 1px at 82% 12%,#a0b4ff,transparent),radial-gradient(1.5px 1.5px at 66% 38%,#dde0ff,transparent),radial-gradient(1px 1px at 28% 62%,#a0b4ff,transparent),radial-gradient(1.5px 1.5px at 90% 70%,#dde0ff,transparent),radial-gradient(1px 1px at 8% 86%,#a0b4ff,transparent),radial-gradient(1px 1px at 50% 8%,#dde0ff,transparent);animation:tw 4s ease-in-out infinite}
.sky::after{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 40% 28%,#fff,transparent),radial-gradient(1.5px 1.5px at 74% 54%,#a0b4ff,transparent),radial-gradient(1px 1px at 18% 44%,#dde0ff,transparent),radial-gradient(1.5px 1.5px at 58% 84%,#dde0ff,transparent);animation:tw 5.5s ease-in-out infinite reverse}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
main{position:relative;z-index:1}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.slide h1,.slide h2,.opts,.slide>.lead,.opts+*,.slide>.btn{animation:rise .45s cubic-bezier(.2,.9,.2,1) both}
.opts .opt{animation:rise .45s cubic-bezier(.2,.9,.2,1) both}
.opts .opt:nth-child(1){animation-delay:.05s}.opts .opt:nth-child(2){animation-delay:.11s}.opts .opt:nth-child(3){animation-delay:.17s}.opts .opt:nth-child(4){animation-delay:.23s}.opts .opt:nth-child(5){animation-delay:.29s}.opts .opt:nth-child(6){animation-delay:.35s}.opts .opt:nth-child(7){animation-delay:.41s}.opts .opt:nth-child(8){animation-delay:.47s}.opts .opt:nth-child(9){animation-delay:.53s}
.picking .opt:not(.picked){opacity:.3;transform:scale(.98);transition:opacity .25s,transform .25s}
.opt.picked{background:rgba(232,199,123,.26)!important;border-color:#e8c77b!important;box-shadow:0 0 0 4px rgba(232,199,123,.18),0 0 26px rgba(232,199,123,.4);animation:pickpop .32s cubic-bezier(.2,1.4,.4,1) both!important;animation-delay:0s!important}
@keyframes pickpop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1.015)}}
.hero{position:relative;height:130px;align-items:center}
.big{animation:burst .9s cubic-bezier(.2,1.2,.3,1) both,float 3s ease-in-out .9s infinite}
@keyframes burst{0%{opacity:0;transform:scale(.1) rotate(-90deg)}60%{opacity:1;transform:scale(1.25) rotate(8deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.sp{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#e8c77b;box-shadow:0 0 10px #e8c77b;opacity:0;animation:fly 1.1s ease-out .15s both}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}
.slide>.pre,.slide>.book,.slide>.name,.slide>.who,.slide>.line,.slide>.rule,.slide>.sec,.slide>div>.full,.slide>.btn,.slide>.note{animation:rise .5s cubic-bezier(.2,.9,.2,1) both}
.slide>.pre{animation-delay:.5s}.slide>.book{animation-delay:.6s}.slide>.name{animation-delay:.7s}.slide>.who{animation-delay:.8s}.slide>.line{animation-delay:.9s}.slide>.sec{animation-delay:1.1s}.slide>div>.full:nth-child(1){animation-delay:1.2s}.slide>div>.full:nth-child(2){animation-delay:1.35s}.slide>div>.full:nth-child(3){animation-delay:1.5s}.slide>.btn{animation-delay:1.65s}
.btn:not([disabled]){animation:rise .45s both,glow 2.6s ease-in-out 1s infinite}
@keyframes glow{50%{box-shadow:0 0 22px rgba(232,199,123,.45)}}
@media (prefers-reduced-motion:reduce){.sky,.sky::after,.opts .opt,.slide *,.big,.sp,.btn{animation:none!important}.opt.picked{transition:none}}

/* 결과 화면: 카드 하나에 인물을 담고, 생각→행동→그 뒤를 한 줄 타임라인으로 */
.res{padding-bottom:8px}
.kick{text-align:center;font:600 13px/18px var(--sans);letter-spacing:.14em;color:var(--gold);margin:4px 0 16px;opacity:.95}
.card{position:relative;overflow:hidden;border-radius:28px;padding:26px 22px 28px;text-align:center;background:radial-gradient(120% 90% at 50% 0%,#2b2f78 0%,#14163a 46%,#0a0a1f 100%);border:1px solid rgba(232,199,123,.38);box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 0 6px rgba(232,199,123,.05),inset 0 1px 0 rgba(255,255,255,.12)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 14% 22%,#fff,transparent),radial-gradient(1px 1px at 84% 16%,#dde0ff,transparent),radial-gradient(1.5px 1.5px at 72% 62%,#fff,transparent),radial-gradient(1px 1px at 22% 74%,#a0b4ff,transparent),radial-gradient(1px 1px at 90% 86%,#dde0ff,transparent),radial-gradient(1.5px 1.5px at 8% 48%,#a0b4ff,transparent);opacity:.85;animation:tw 4.5s ease-in-out infinite}
.emb{position:relative;height:96px;display:grid;place-items:center}
.card .big{position:relative;width:76px;height:76px;font-size:40px;box-shadow:0 0 34px rgba(232,199,123,.45),inset 0 0 0 1.5px rgba(232,199,123,.5);background:radial-gradient(circle at 50% 35%,#34388a,#10112c 70%)}
.card .sp{left:50%;top:50%}
.cbook{position:relative;margin:8px 0 6px;font:600 13px/18px var(--sans);letter-spacing:.12em;color:rgba(255,255,255,.62)}
.cname{position:relative;margin:0;font:700 44px/52px var(--read);letter-spacing:-.5px;color:#fff;text-wrap:balance}
.div{position:relative;display:flex;align-items:center;gap:12px;margin:16px auto 18px;max-width:200px}
.div i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(232,199,123,.7))}.div i:last-child{transform:scaleX(-1)}
.div b{color:#e8c77b;font-size:14px}
.cintro{position:relative;margin:0 0 6px;font-size:14px;color:rgba(255,255,255,.64)}
.cnick{position:relative;margin:0 0 8px;font:700 16px var(--sans);color:#e8c77b}
.cline{position:relative;margin:0;font:400 19px/31px var(--read);color:rgba(255,255,255,.94);text-wrap:balance}
.head2{text-align:center;font-size:14px;line-height:21px;color:var(--muted);margin:20px 12px 24px}
.tl{list-style:none;margin:0 0 28px;padding:0 0 0 30px;position:relative}
.tl::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:1.5px;background:linear-gradient(#e8c77b,rgba(232,199,123,.1))}
.tl li{position:relative;padding:0 0 22px}.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-30px;top:5px;width:16px;height:16px;border-radius:50%;background:#060612;border:2px solid #e8c77b;box-shadow:0 0 12px rgba(232,199,123,.5)}
.tl li b{display:block;font:700 13px/18px var(--sans);letter-spacing:.1em;color:#e8c77b;margin-bottom:4px}
.tl li p{margin:0;font:400 17px/28.5px var(--read);color:rgba(255,255,255,.92)}
.scn{text-align:center;margin:12px 0 0;font-size:13px;color:var(--faint)}
.res>*{animation:rise .55s cubic-bezier(.2,.9,.2,1) both}
.res>.kick{animation-delay:.1s}.res>.card{animation-delay:.2s}.res>.head2{animation-delay:.9s}.res>.tl{animation:none}
.tl li{animation:rise .55s cubic-bezier(.2,.9,.2,1) both}.tl li:nth-child(1){animation-delay:1.05s}.tl li:nth-child(2){animation-delay:1.25s}.tl li:nth-child(3){animation-delay:1.45s}
.res>.btn{animation-delay:1.65s}
.card .big{animation:burst .9s cubic-bezier(.2,1.2,.3,1) .35s both,float 3s ease-in-out 1.25s infinite}
@media (prefers-reduced-motion:reduce){.res>*,.tl li,.card::before{animation:none!important}}

/* 줄바꿈: 한글은 단어 단위로 끊고, 짧은 줄 하나가 외톨이로 남지 않게 */
body{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
h1,h2,.name,.cname,.cline,.msg,.head2{text-wrap:balance}
p,li,.opt,.chk,.note,.lead{text-wrap:pretty}
.opt{overflow-wrap:anywhere}
.ci{display:block;margin:0 0 8px;font:400 14px/20px var(--sans);color:rgba(255,255,255,.62)}
.cname{overflow-wrap:break-word;hyphens:manual}
.card{max-width:100%}
.chips span{white-space:nowrap}
.toast span{text-wrap:balance}

.cwho{position:relative;margin:12px auto 0;max-width:330px;font:400 15px/23px var(--sans);color:rgba(255,255,255,.74);text-wrap:balance}
.div{margin-top:18px}

.clab{position:relative;margin:0 0 6px;font:700 12px/16px var(--sans);letter-spacing:.14em;color:#e8c77b}
.cnick{margin-bottom:14px}

/* 결과 */
.kick{text-align:left;letter-spacing:.06em;font:600 14px/20px var(--sans);color:rgba(255,255,255,.62);margin:8px 0 20px}
.card{border:0;border-radius:0;background:none;box-shadow:none;padding:0 0 28px;text-align:left;border-bottom:1px solid rgba(255,255,255,.14)}
.card::before{display:none}
.emb{display:none}
.cbook{margin:0 0 8px;font:600 14px/20px var(--sans);letter-spacing:0;color:#e8c77b}
.cname{font:700 44px/52px var(--read);letter-spacing:-1px;margin:0;color:#fff;text-wrap:balance}
.cwho{margin:14px 0 0;max-width:none;font:400 16px/25px var(--sans);color:rgba(255,255,255,.72)}
.div{display:none}
.cnick{margin:22px 0 0;color:#fff;font:600 16px/24px var(--sans)}
.clab{margin:26px 0 8px;font:600 13px/18px var(--sans);letter-spacing:0;color:rgba(255,255,255,.62)}
.cline{margin:0;font:400 19px/31px var(--read);color:#fff;text-align:left}
.head2{text-align:left;margin:22px 0 26px;font-size:14px;color:rgba(255,255,255,.62)}
.tl{padding-left:22px;margin-bottom:28px}
.tl::before{left:4px;top:8px;bottom:8px;width:1px;background:rgba(255,255,255,.22)}
.tl li::before{left:-22px;top:9px;width:9px;height:9px;border:0;background:#e8c77b;box-shadow:none}
.tl li b{letter-spacing:0;font:600 14px/20px var(--sans);color:rgba(255,255,255,.62)}
.tl li p{font:400 17px/28px var(--read);color:rgba(255,255,255,.94)}
.scn{text-align:left;margin:14px 0 0}
.res>*{animation:rise .45s ease both}

const RT={"엘리자베스 베넷":{"who":"엘리자베스는 『오만과 편견』에 나오는 베넷 집안 딸이야. 롱본이라는 시골 마을에 사는 사람이지. 이 책은 오스틴이 쓴 소설이고, 결혼과 신분을 두고 사람들이 서로를 오해하는 이야기야. 이 장면에서 엘리자베스는 갑자기 찾아온 높은 집안 부인에게 마당 구석으로 불려 가.","scene":"어느 날 롱본 앞에 으리으리한 마차가 멈춰. 내린 사람은 캐서린 드 버그 부인이야. 부인은 인사도 대충 하고, 엘리자베스의 엄마는 거의 투명인간 취급해. 그러더니 엘리자베스한테 밖에서 좀 걷자고 해. 정원 구석에 가자마자 본론이 나와. 엘리자베스가 다아시와 곧 약혼한다는 소문을 들었으니 당장 아니라고 하래. 부인은 다아시가 아기 때부터 자기 딸 앤이랑 짝이 정해져 있었다고 주장해. 엘리자베스가 '본인이 따님을 원하지 않으면요?' 하고 되묻자 부인 얼굴이 벌게져. 집안이 모자라다는 말까지 나오는데, 엘리자베스는 「우리 아버지도 신사예요, 그 점에선 다를 게 없어요.」라고 받아쳐.","thought":"엘리자베스는 높은 사람이 시킨다고 내 일을 대신 정해 줄 수는 없다고 봤어. 그래서 자기 행복은 남 눈치 안 보고 정하겠다고 마음먹었어. 부인이 신분 이야기를 줄줄이 늘어놓아도, 엘리자베스는 그 말을 그대로 받아들이지 않았어.","action":"부인이 마지막 카드를 꺼내. 약혼했냐고 묻고, 안 했다니까 앞으로도 절대 안 하겠다고 약속하래. 엘리자베스는 그런 약속은 안 하겠다고 거절해. 부인이 리디아의 추문까지 끄집어내는데도 끝까지 안 물러서. 속은 부글거렸을 텐데, 할 말은 또박또박 했어.","after":"부인은 작별 인사도 없이 떠나. 엘리자베스의 엄마는 그 귀부인이 다른 소식을 전하러 온 줄 알고 들떠 있어. 엘리자베스는 차마 사실을 말하지 못해. 반전은 그다음이야. 부인은 곧장 런던의 다아시에게 가서 이 대화를 다 일러바쳐. 그런데 약속을 안 했다는 대목이 오히려 다아시에게 희망이 됐어.","mirror":"누가 나보다 높은 자리에서 '넌 자격이 안 돼'라고 할 때, 속은 부글거리는데 말이 안 나오는 순간이 있잖아. 엘리자베스도 그 순간을 지나갔어. 억울한 일 앞에서 내 기준을 말로 꺼내 본 면이 나랑 닮았을 수 있어."},"다아시":{"who":"다아시는 『오만과 편견』에 나오는 부잣집 남자야. 어릴 때 외아들로 떠받들려 컸어. 바르게 살라는 건 배웠는데, 남을 낮춰 보는 버릇은 아무도 고쳐 주지 않았대. 봄에 엘리자베스에게 청혼했다가 거절당했는데, 이 장면은 그 일이 있고 한참 뒤야.","scene":"롱본 근처 시골길이야. 빙리랑 제인은 저만치 뒤처지고, 키티는 루카스 집으로 빠져. 어쩌다 보니 엘리자베스와 다아시 둘만 남아. 발소리만 들리는 길이야. 먼저 용기를 낸 건 엘리자베스야. 리디아 일을 다 안다고, 온 가족 대신 고맙다고 말해. 다아시는 그 일이 알려지는 게 싫었대. 가족이 고마워할 일도 아니래. 그러고는 조용히 덧붙여. '다 당신 때문에 한 거예요.'","thought":"다아시는 봄에 거절당한 마음이 지금도 그대로야. 그런데 이번엔 상대 마음이 먼저라고 생각해. 그 거절이 자기를 바꿔 놓았다는 것도 알아. 그래서 이렇게 털어놔. 「당신이 거절해 준 덕에 내 콧대가 제대로 꺾였어요.」","action":"다아시는 조심스럽게 말을 꺼내. 마음이 그대로면 딱 한마디만 해 달래. 그럼 다시는 이 얘기를 안 꺼내겠대. 첫 번째 때와 달리, 이번엔 상대 뜻부터 물은 거야. 한 번 접었던 말을 다시 꺼내는 건 쉽지 않았을 텐데, 둘만 남은 산책길에서 그 말을 해.","after":"엘리자베스는 말을 좀 더듬어. 그래도 뜻은 분명해. 그때랑 지금 마음이 완전히 달라졌다고, 고맙고 기쁘게 받겠다고 해. 다아시한테는 평생 처음 느끼는 기쁨이었대. 둘은 한참 걸으며 서로의 잘못을 하나씩 꺼내 놓아. 그날 밤 엘리자베스가 제인한테 털어놓는데, 제인은 농담하지 말라며 안 믿어.","mirror":"한 번 거절당한 말을 다시 꺼낼지 말지 고민해 본 적이 있다면 다아시와 닮았어. 상대 마음을 먼저 묻는 쪽으로 방식을 바꾼 면이 있어. 크게 틀어졌던 사람과 한참 뒤에 그때 얘기를 꺼내는 순간이 떠오를 수 있어."},"아킬레우스":{"who":"아킬레우스는 고대 그리스 서사시 『일리아스』에 나오는 그리스 최강의 전사야. 트로이와 벌이는 전쟁 이야기 속에서, 총사령관 아가멤논에게 크게 서운한 일을 당하고 싸움에서 손을 뗀 상태야. 이 장면에서는 그 서운함을 풀어 주겠다며 사절단이 찾아와.","scene":"트로이 평원에 모닥불이 천 개 넘게 타올라. 제우스가 약속대로 그리스군을 하루 종일 몰아붙였거든. 아가멤논이 드디어 아킬레우스에게 사과하기로 해. 보상 목록이 어마어마해. 황금, 세발솥, 명마 열두 필, 손도 안 댄 브리세이스, 도시 일곱 개까지 있어. 사절로 오디세우스, 아이아스, 아킬레우스를 어릴 때 키운 포이닉스가 가. 막사에 들어서니 아킬레우스는 리라를 뜯으며 옛 영웅들의 공을 노래하고 있고, 친구 파트로클로스가 조용히 기다려. 오디세우스가 목록을 조목조목 읊어.","thought":"아킬레우스는 보상이 아무리 커도 마음이 안 움직여. 딴생각 품고 딴말하는 건 싫다고 했어. 엄마한테 들은 두 운명 이야기도 털어놔. 여기 남아 싸우면 이름이 영원히 남고, 집에 가면 이름은 사라져도 오래 산대. 그러면서 이렇게 말해. 「소 떼는 또 빼앗아 오면 되지만 목숨은 못 돌려받아.」","action":"아킬레우스는 선물을 받지 않아. 내일 아침 배를 띄워 집으로 가겠대. 포이닉스가 울면서 매달리고, 아이아스는 여자 하나 때문에 이러냐고 쏘아붙여. 아킬레우스는 인정해. '네 말이 맞아. 근데 화가 안 풀려.' 그래도 마음은 안 바뀌어.","after":"아킬레우스는 상대 쪽 공격이 자기 배에 닿기 전엔 꿈쩍도 안 하겠다고 해. 사절들은 빈손으로 돌아가. 이 장면은 여기에 한 가지를 더 알려 줘. 아가멤논의 원래 전갈 끝엔 내가 더 높은 왕이니 굽히라는 말이 붙어 있었는데, 오디세우스가 그 대목만 빼고 전했대.","mirror":"상대가 잘못을 인정하고 선물까지 들고 왔는데도 마음이 안 풀리는 일, 겪어 본 적 있을 수 있어. 아킬레우스는 '네 말이 맞는데 화가 안 풀린다'고 솔직하게 말했어. 받을 걸 받아도 풀리지 않는 마음이 있다는 면이 닮았어."},"코딜리아":{"who":"코딜리아는 셰익스피어의 『리어 왕』에 나오는 막내딸이야. 영국의 늙은 왕 리어에게 딸이 셋 있는데, 그중 아버지가 제일 아끼는 딸이지. 이 장면은 책의 맨 처음이야. 왕이 나라를 딸들에게 나눠 주겠다며, 누가 자기를 제일 사랑하는지 묻는 날이야.","scene":"리어 왕이 신하들을 불러 모아 지도를 펼쳐 놓고 선언해. 나랏일은 젊은 사람들에게 넘기겠대. 그러고는 세 딸에게 묻는 거야. 누가 나를 제일 사랑하냐고. 제일 사랑하는 딸에게 제일 큰 몫을 주겠대. 큰딸 고네릴은 눈빛보다, 자유보다, 목숨보다 아버지가 귀하다고 해. 둘째 리건은 한술 더 떠. 리어 얼굴이 활짝 펴져. 이제 막내 코딜리아 차례야. 제일 기름진 땅이 남아 있고, 언니들보다 센 말을 해야 받을 수 있어.","thought":"코딜리아는 입에 발린 말은 못 하겠다고 생각했어. 사랑은 자식으로서 할 만큼 하는 거라고 믿었어. 그래서 이렇게 말해. '아버지, 저는 보탤 말이 없어요.' 언니들은 아버지만 사랑한다면서 왜 남편을 뒀냐고 되묻기까지 해. 틀린 말이 아니라서 더 아픈 말이었어.","action":"리어가 한 번 더 기회를 줘. 「아무 말도 없으면, 너한테 갈 것도 없다.」 다시 생각해 보라는 경고야. 그래도 코딜리아는 말을 안 바꿔. 입에 발린 소리는 끝까지 못 해.","after":"리어가 폭발해서 코딜리아의 몫을 빼앗고, 부녀의 연까지 끊어. 그 땅은 고네릴과 리건이 나눠 가져. 충신 켄트가 말리다가 나라에서 쫓겨나. 지참금이 사라지자 부르고뉴 공작은 슬쩍 발을 빼. 그런데 프랑스 왕이 이 사람은 그 자체로 보물이라며 코딜리아를 왕비로 데려가. 막내가 떠나자마자 두 언니는 머리를 맞대고 아버지를 걱정하는 척 손쓸 궁리를 해.","mirror":"기분 좋은 말만 해 주는 사람 사이에서, 바른말 하는 사람이 오히려 손해를 보는 날이 있잖아. 코딜리아는 말을 보태지 않고 자기 마음의 크기대로만 말했어. 그 선택이 바로 몫을 잃는 걸로 돌아온 면이 닮았을 수 있어."},"페넬로페":{"who":"페넬로페는 호메로스의 『오디세이아』에 나오는 이타카의 왕비야. 남편 오디세우스는 트로이 전쟁에 나간 뒤로 스무 해 가까이 돌아오지 않았어. 사람들은 그녀를 기다린 아내로만 기억해. 그런데 이 장면은 그 기다림이 가만히 앉아 있는 게 아니었다고 말해.","scene":"책 첫 권에서 페넬로페는 위층에서 내려와. 가수가 트로이 영웅들의 쓸쓸한 귀향 노래를 부르자 '그 슬픈 노래는 그만 불러 줘' 하고 베일로 얼굴을 가린 채 울어. 마지막 몇 년은 백 명 넘는 구혼자에게 둘러싸여 날마다 수를 뒀어. 아들이 몰래 떠났다는 소식에 밥도 물도 끊고 드러눕기도 했어. 어느 날 잔치 한복판에 일부러 나타나, 남편이 아들 수염이 나면 재혼하라고 했다고 꺼내. 그러고는 이렇게 말해. '구혼하려면 선물을 들고 와야지.' 구혼자들이 앞다퉈 목걸이며 귀걸이를 바쳐.","thought":"페넬로페는 남편을 봤다는 말을 덥석 믿지 않아. 믿고 싶지만 또 실망할까 봐 일부러 기대를 접어 두는 사람이었어. 거지 차림의 손님을 밤에 불러 앉혔을 때도, 그이가 무슨 옷을 입었는지 말해 보라며 시험부터 했어.","action":"페넬로페는 부드러운 말로 선물을 거둬들였어. 속셈은 다른 곳에 두고 있었던 거야. 사냥개가 사슴을 문 금 브로치까지 정확히 나오자 그제야 울음을 터뜨렸어. 자기가 챙겨 준 옷이었거든. 꿈 이야기를 하면서도, 이건 헛꿈 같다며 쉽게 믿지 않았어.","after":"마지막 권에서 저승의 아가멤논이 이 소식을 듣고 감탄해. 「그녀의 이름은 노래가 되어 영영 안 잊힐 거야.」 이 장면은 정말 2천7백 년 넘게 불리고 있다고 말해. 이 책은 반쯤은 페넬로페의 노래래. 남편은 바다에서, 아내는 집에서 각자 싸웠다는 거야.","mirror":"오래 기다리는 동안 계속 결정하라고 몰아붙이는 사람들 사이에 있어 본 적이 있다면, 페넬로페와 닮은 면이 있어. 기다림이 곧 가만히 있는 건 아니야. 믿고 싶지만 일부러 한 번 더 확인하는 마음도 닮았을 수 있어."},"텔레마코스":{"who":"텔레마코스는 『오디세이아』에 나오는 스무 살 무렵의 청년이야. 아버지 오디세우스가 전쟁에 나갈 때 갓난아기였대. 요즘 말로 하면 대학생 나이쯤이야. 이 장면에서 그는 자기 집을 점령한 낯선 사람들 앞에서 말 한마디 못 꺼내고 있어.","scene":"이타카 섬 왕궁이야. 낯선 남자들이 마당에서 소를 잡고, 말판 놀이를 하고, 술판을 벌여. 매일 그래. 이 사람들은 왕비 페넬로페에게 장가들겠다고 몰려든 구혼자들이야. 신부가 정해질 때까지 안 나간다고 하고, 먹고 마시는 건 전부 이 집 살림이야. 텔레마코스는 곳간이 비어 가는 걸 구석에 앉아 보고만 있어. 그러다 문간에 손님이 와. 사실은 여신 아테나가 변장한 거야. 텔레마코스는 얼른 창을 받아 주고 자리부터 내줘.","thought":"텔레마코스는 아버지가 불쑥 나타나 다 쫓아내는 상상만 하고 있었어. 손님이 너 오디세우스 아들 맞냐고 하자 씁쓸하게 웃으며 '엄마는 그렇대요. 전 모르죠' 하고 답해. 스스로는 뭘 해야 할지 몰랐던 거야. 그때 손님이 건넨 말이 있어. 「이제 어린애처럼 굴 나이는 지났잖아.」","action":"손님은 할 일을 알려 줘. 섬 사람들을 모아 구혼자들에게 나가라고 공표하고, 그다음엔 배를 구해 아버지 소식을 직접 캐 오라고 해. 그날 밤 텔레마코스는 구혼자들에게 처음으로 목소리를 높여 나가 달라고 해. 다음 날 아침 민회에서도 같은 말을 해.","after":"구혼자 우두머리 안티노오스는 오히려 잘못은 네 엄마한테 있다고 되받아쳐. 민회는 빈손으로 끝나. 그래도 텔레마코스는 포기하지 않아. 멘토르로 변한 아테나의 도움으로 배를 구하고, 엄마한테도 알리지 않은 채 밤바다로 나가.","mirror":"누가 등을 한 번 떠밀어 주길 기다리던 때가 있었을 수 있어. 말은 해야 하는데 첫마디가 도저히 안 떨어지던 순간 말이야. 텔레마코스도 그랬고, 한번 말하고 나니 다음 걸음이 보인 면이 닮았어."},"에픽테토스":{"who":"에픽테토스는 고대의 철학자야. 노예 출신이었는데, 같은 일도 어떻게 바라보느냐에 따라 무게가 달라진다고 가르쳤어. 『엥케이리디온』은 그 가르침을 짧게 묶은 작은 책이야. 이 장면에서 에픽테토스는 사건 속 인물이라기보다 조언을 해 주는 사람으로 나와.","scene":"이 장면은 이렇게 시작해. 형이 또 네 몫을 슬쩍 가져갔어. 속이 부글부글해. 에픽테토스라면 이 순간 딱 하나만 묻는대. 너 지금 이 일을 어느 쪽 손잡이로 들고 있어? 모든 일엔 손잡이가 두 개 달려 있대. 한쪽으로 들면 들 만하고, 다른 쪽으로 들면 너무 무거워서 못 들어. 형이 널 부당하게 대했다는 쪽을 잡으면 못 들어. 반대편 손잡이는 이 사람이 너한테 누군지 떠올리는 거야. 같이 자란 형제라는 손잡이야.","thought":"에픽테토스는 일은 그대로인데, 어떻게 바라보느냐가 무게를 정한다고 생각했어. 서운하게 한 건 맞지만, 같이 자란 형제로 바라보면 한 식탁에서 밥 먹고 큰 사람이 보여. 그러면 같은 일이 들 만해진다는 거야.","action":"에픽테토스가 알려 주는 방법은 이래. 「욱하는 순간엔 바로 받지 말고, 한 박자만 시간을 벌어.」 누가 욕해도 아픈 건 그걸 모욕으로 받아들인 순간부터래. 비판을 들으면 맞는 말은 고치고, 틀린 말은 헛짚은 쪽이 손해라고 생각하래. 뒤에서 네 흉을 봤다는 소식에는 '내 다른 흉은 아직 모르나 보네' 하고 받으래.","after":"대신 연극 이야기가 이어져. 우리는 극작가가 정해 준 배역을 받은 배우래. 거지 역이든 왕 역이든 잘 해내는 게 내 몫이고, 배역을 고르는 건 내 몫이 아니래.","mirror":"가까운 사람이 선을 넘었을 때, 바로 받아치고 싶은 마음과 그냥 참고 싶은 마음이 같이 올라올 수 있어. 에픽테토스는 그 사이에서 한 박자 쉬는 방법을 알려 줘. 일은 그대로인데 어떻게 바라볼지 바꿔 보는 면이, 너한테도 쓸모 있을 수 있어."},"라파엘 히슬로다이":{"who":"라파엘 히슬로다이는 토머스 모어의 『유토피아』에 나오는 여행자야. 그을린 얼굴에 수염이 덥수룩한 포르투갈 사람이고, 아메리고 베스푸치를 따라 세 번이나 바다를 건넜대.","scene":"1515년, 모어는 왕의 심부름으로 플랑드르에 와 있어. 협상이 쉬는 틈에 안트베르펜에 들러. 미사를 마치고 나오는데 친구 피터 힐레스 옆에 낯선 남자가 서 있어. 모어는 배 선장인 줄 알아. 힐레스가 웃으며 소개해 줘. 셋이 모어의 숙소 정원 벤치에 앉아. 힐레스가 먼저 권해. '그 지식이면 왕 밑에서 일해야죠.' 라파엘은 고개를 저어. '지금 내 맘대로 사는 게 좋아요.'","thought":"라파엘은 왕들이 제 나라 돌보기보다 남의 땅 뺏기에 바쁘다고 봤어. 회의만 열리면 어느 땅을 먹을지, 세금을 어떻게 더 짜낼지만 따진다는 거야. 그런 곳에서 좋은 이야기를 꺼내 봐야 분위기만 깬다고 눈총을 받을 거라고 생각했어.","action":"모어가 한발 물러서서 달래. 연극 도중에 딴 대본 읊지 말고 그 무대에 맞춰 조금씩 바꿔 보라고. 라파엘은 단호해. '그럼 결국 거짓말을 하게 돼요.' 그러고는 사유재산이 있는 한 제대로 된 나라는 못 만든다는 폭탄 발언까지 해. 자기가 5년 넘게 산 섬은 달랐다면서.","after":"모어가 '다 같이 가지면 누가 열심히 일해요?' 하고 받아쳐. 라파엘은 느긋하게, 그 섬을 직접 봤으면 그런 말 못 할 거래. 친구들은 이유를 더 듣고 싶어 하고, 점심 뒤에 라파엘이 섬을 그려 줘. 초승달처럼 휜 섬에 서로 꼭 닮은 도시가 쉰네 개 있대.","mirror":"윗사람이 같이 일하자고 하는데 단칼에 거절해 본 적이 있다면 라파엘과 닮았어. 나는 내 방식대로 살고 싶은 면이 있고, 맞춰 가다 보면 결국 거짓말을 하게 될까 봐 겁나는 마음이 있었을 수 있어."},"마르쿠스 아우렐리우스":{"who":"마르쿠스 아우렐리우스는 로마의 황제이면서 철학자야. 『명상록』은 그가 자기 자신에게 쓴 공책 같은 책이야. 이 장면은 황제의 아침 일과야. 그런데 그 일과는 의외로 소박해. 오늘 만날 사람부터 적어 두는 거야.","scene":"아침이야. 일정표를 펴기도 전에 황제가 공책부터 꺼내. 오늘 만날 사람 목록을 적는 거야. 이름이 아니라 유형을 적어. 2권이 이 장면으로 시작해. 칭찬해 줄 사람이나 반가운 얼굴일 것 같지만 정반대야. '오늘 참견쟁이 하나는 꼭 만난다.' 은혜 모르는 사람, 거만한 사람, 속이는 사람, 샘내는 사람, 남이랑 못 어울리는 사람까지 쭉 적어.","thought":"왜 아침부터 이런 걸 적을까? 마르쿠스의 설명은 이래. 저 사람들이 그러는 건 뭐가 좋고 뭐가 나쁜지 몰라서래. 알았으면 그렇게 안 굴었을 거라는 거지. 게다가 못되게 구는 사람도 자기와 한 식구래. 피가 섞여서가 아니라 똑같이 생각하는 머리를 나눠 가진 사이라서야.","action":"그래서 이렇게 적어 둬. 「남이 아무리 못되게 굴어도 내 마음까지 망칠 순 없다.」 상처를 줄지 말지는 저쪽이 아니라 자기가 정한다는 뜻이야. 9권에는 더 현실적인 방법도 있어. 뻔뻔한 사람 때문에 열 받으면 '세상에 뻔뻔한 사람이 없을 수 있어?' 하고 스스로 물어보래.","after":"마르쿠스는 자기한테도 손가락을 돌려. 너도 그런 잘못 꽤 하잖아, 안 하는 척하는 건 겁나거나 체면 때문일 뿐이라고 11권에서 스스로를 몰아세워. 이 장면은 이 아침 목록이 화 안 내려고 미리 맞는 예방주사 같다고 해. 실패한 날도 많았을 거라서 여러 번 적었을 거래.","mirror":"회사에 꼭 한 명 있는 성가신 사람을 오늘도 만나야 한다면, 마르쿠스의 아침과 닮았어. 그 사람을 바꾸기보다 네 마음이 흔들리는 방식을 먼저 정리해 두는 면이 있어. 너도 오늘 너를 긁을 사람을 미리 떠올려 볼 수 있어."},"이반 일리치":{"who":"이반 일리치는 톨스토이의 『이반 일리치의 죽음』에 나오는 지방 도시의 판사야. 춤 잘 추는 젊은 판사로 통했어. 이 장면은 그가 결혼하고 집이 시끄러워지기 시작한 때야. 이 장면은 그의 결혼 생활 이야기이고, 따라 하라는 게 아니라 거울로 보는 장면이야.","scene":"지방 도시의 저녁 파티에서 이반은 프라스코비야를 만나. 좋은 집안 딸이고, 예쁘고, 재산도 조금 있어. 그녀가 먼저 이반에게 빠져. 이반이 결혼한 이유는 사랑이 아니야. 자기한테 편하고, 높은 사람들 눈에도 괜찮은 짝이라서야. 청혼도 계산표 맞춰 보듯 해. 신혼은 나쁘지 않아. 새 가구, 새 그릇, 새 이불이 있어. 그런데 아내가 임신을 하면서 괜히 질투하고, 매달리고, 날마다 트집을 잡아.","thought":"이반의 계산표엔 이런 칸이 없었어. 결혼해도 사는 게 여전히 가볍고 점잖을 줄 알았거든. 「결혼에 바란 건 밥, 살림, 잠자리뿐이었다.」 톨스토이는 이반의 결혼 생활을 딱 그만큼으로 줄여. 나머지는 체면이야.","action":"이반이 찾은 해결책은 대화가 아니라 일이야. 집이 시끄러우면 서류를 들고 사무실로 숨어. 이게 평생 쓰는 도피처가 돼. 이 장면은 이반이 17년 동안 이걸 했다고 해. 7년 뒤에는 다른 도시의 검사보로 올라가. 집이 힘들어질수록 일에서는 더 잘나가.","after":"일은 술술 풀리는데 집은 점점 식어 가. 둘은 한집에서 남처럼 지내. 이 장면은 이반이 아내가 왜 저러는지 한 번도 안 물었다고 짚어 줘. 문제를 푸는 대신 문을 닫은 거야. 그리고 이렇게 물어. '너는 힘든 일이 생기면 어디로 숨어?'","mirror":"집에 가기 싫어서 괜히 회사에 더 남아 있던 날이 떠오를 수 있어. 이반은 힘든 일 앞에서 대화 대신 일을 고르는 면이 있었어. 나도 가끔 문제를 풀기보다 다른 데로 피하는 면이 있는지 한 번 비춰 보는 거야."},"단테":{"who":"단테는 『신곡』을 쓴 이탈리아 시인이야. 피렌체라는 도시 사람인데, 1302년 그곳에서 쫓겨났어. 『신곡』의 대부분을 떠돌면서 썼대. 이 장면은 쫓겨난 그에게 고향이 돌아와도 된다고 제안하는 대목이야.","scene":"이 장면은 로댕의 생각하는 사람 이야기로 시작해. 그 조각은 원래 거대한 청동 문 꼭대기에 앉아 아래를 내려다보고 있었대. 문 이름은 지옥의 문이고, 로댕은 그 남자를 단테로 만들었어. 단테는 1302년 피렌체에서 쫓겨나 이 시 대부분을 떠돌면서 써. 그러던 중 피렌체가 제안을 해. 벌금을 내고 죄인처럼 공개 참회를 하면 받아 주겠다는 거야.","thought":"단테는 그 제안을 받아들이지 않아. 이렇게 말해. '그렇게는 안 가. 해와 별은 어디서든 보이잖아.' 천국에서 카차귀다가 미리 해 준 말도 있었어. 「못난 무리와 갈라서 홀로 한 편이 된 게 네 자랑이다.」","action":"단테는 제안을 거절하고 계속 떠돌며 시를 썼어. 제목은 원래 그냥 코메디아였대. 슬프게 시작해서 기쁘게 끝나서야. 게다가 학자들 말인 라틴어 대신 피렌체 사람들이 시장에서 쓰는 말로 썼어. 지금으로 치면 논문 대신 친구 말투로 대작을 쓴 셈이야.","after":"단테는 1321년 라벤나에서 죽어. 200년쯤 뒤 피렌체가 유해라도 돌려 달라고 해서 교황 허락까지 받아 관을 열어. 그런데 안은 텅 비어 있었어. 라벤나 수도사들이 몰래 뼈를 빼돌려 숨긴 거야. 그 뼈는 1865년에야 벽 속에서 다시 나와. 떠돌며 쓴 시가 쫓아낸 도시의 권력자들보다 훨씬 오래 살아남았어.","mirror":"떠난 곳에서 조건을 걸고 돌아와도 된다고 할 때, 돌아가지 않기로 해 본 적이 있다면 단테와 닮았어. 제일 억울했던 시절에 오히려 제일 많이 자란 것 같은 면이 나한테도 있을 수 있어."},"세네카":{"who":"세네카는 로마의 철학자야. 『도덕에 관한 편지』는 그가 친구 루킬리우스에게 보낸 편지 모음이야. 그는 어떻게 마음을 다잡고 사는지를 편지로 이야기해. 이 장면은 세네카가 휴양지에 갔다가 하루 만에 나온 일을 적은 편지야.","scene":"루킬리우스는 시칠리아에서 에트나 화산을 구경하고 있어. 세네카는 부러워하면서 자기 처지를 적어. 나는 바이아이로 만족해야 했지. 그런데 도착한 다음 날 떠나 버렸어. 바이아이는 나폴리 만에 있는 로마 최고의 휴양지야. 온천에 바다에 부자들 별장이 줄지어 있어. 지금으로 치면 밤마다 요트 파티가 열리는 바닷가 리조트쯤 돼. 경치도 좋고 물도 좋은데 왜 하루 만에 도망쳤을까?","thought":"분위기 때문이야. 바닷가엔 취한 사람들이 비틀대고, 배 위에선 잔치가 벌어져. 호수엔 장미 꽃잎이 둥둥 떠 있고 노랫소리가 밤새 울려. 세네카는 마음 다잡기엔 최악의 동네라고 봤어. 그러고는 '카토가 여기서 살았을 것 같아?' 하고 되물어.","action":"세네카는 도착한 다음 날 떠났어. 편지에서는 한니발 이야기도 꺼내. 알프스 눈보라도 못 꺾은 장군인데, 캄파니아에서 편하게 겨울 한 번 나고 무뎌졌대. 칼싸움에선 이겼는데 편안함한테 졌다는 거야. 그리고 자유가 뭔지 말해. 「어디에도 매이지 않고, 운을 나와 맞먹게 만드는 것.」","after":"이 이야기는 편지로 친구에게 전해져. 몇 통 뒤에 루킬리우스가 편지가 좀 대충 쓴 것 같다고 투덜대. 세네카의 답이 좋아. 같이 앉아서 얘기하듯 쓰고 싶대. 꾸민 말 말고 느끼는 걸 그대로 보여 주고 싶다고. 원칙은 느끼는 걸 말하고, 말하는 걸 느끼는 거야. 자기 자신의 주인이 되는 것만큼 값진 건 없대.","mirror":"좋다는 곳에 갔는데 분위기가 안 맞아서 일찍 나온 적이 있다면 세네카와 닮았어. 나는 편안한 곳보다 마음이 흔들리지 않는 곳을 고르는 면이 있을 수 있어. 요즘 나를 슬금슬금 무르게 만드는 편안함이 뭔지 한 번 꼽아 봐도 좋아."},"엘리자베스(일상형)":{"who":"엘리자베스는 『오만과 편견』에 나오는 베넷 집안 딸이야. 아닌 건 아니라고 바로 말하는 사람으로 그려져. 이 장면은 책 초반이야. 집을 물려받을 먼 친척이 갑자기 청혼을 해 오는 아침이야.","scene":"무도회 다음 날 아침이야. 콜린스가 엘리자베스한테 조용히 할 말이 있대. 엄마는 딸들을 끌고 후다닥 나가. 엘리자베스도 따라 나가려니까 엄마가 눈짓으로 딱 막아. 콜린스는 베넷 씨가 떠나면 롱본 집을 물려받을 먼 친척이야. 스물다섯 살 목사이고, 굽신거림이랑 거들먹거림이 한 사람 안에 같이 살아. 청혼이 시작되는데 이유가 순서대로 나와. 목사는 결혼해서 모범을 보여야 하고, 자기가 더 행복해질 거고, 캐서린 부인도 권했대. 사랑이란 말은 끝까지 안 나와.","thought":"콜린스는 지참금이 적은 건 절대 탓 안 하겠다며 통 크게 말해. 엘리자베스가 보기엔 이건 청혼이라기보다 거래 제안서야. 그래서 사랑 없는 결혼은 싫다고 생각해.","action":"엘리자베스는 고맙지만 안 되겠다고 분명하게 거절해. 그런데 콜린스 반응이 더 기가 막혀. 점잖은 아가씨들은 원래 첫 청혼을 한 번 튕기는 법이래. 엘리자베스가 진심이라고 몇 번을 말해도 콜린스는 알겠다는 듯 웃기만 해.","after":"소동은 아버지 서재까지 번져. 베넷 씨는 이렇게 농담해. 「엄마 편 들든 내 편 들든, 한 사람은 너랑 절교야.」 결론은 거절해도 된다는 거야. 엄마는 기절하기 직전이야. 엘리자베스는 평생 살 집이 딸린 청혼을 걷어찼고, 이 이야기는 몇 달 뒤 더 뜻밖의 청혼으로 이어져.","mirror":"아닌 건 아니라고 바로 말하는 편이라면 엘리자베스와 닮았어. 분위기보다 네 기준으로 판단하는 면이 있을 수 있어. 다만 상대가 알아듣지 못해서 답답했던 날도 떠오를 수 있어."},"오디세우스":{"who":"오디세우스는 『오디세이아』의 주인공이야. 트로이 전쟁이 끝나고 고향 이타카로 돌아가는 길에 여러 일을 겪어. 위기에서 머리가 먼저 도는 사람으로 그려져. 이 장면은 거인의 동굴에 갇혔다가 꾀로 빠져나오는 대목이야.","scene":"외눈박이 거인 퀴클롭스들의 땅이야. 오디세우스가 부하 열둘을 데리고 큰 동굴에 들어가. 치즈랑 어린 양이 그득해. 부하들은 챙겨서 튀자는데, 그는 주인 얼굴도 보고 선물도 받아 가겠대. 해 질 녘 거인 폴리페모스가 양 떼를 몰고 와. 짐수레 스물두 대로도 꿈쩍 않을 바위로 입구를 막아. 오디세우스가 제우스 이름을 걸고 손님 대접을 청하자, 거인은 우린 신 따위 신경 안 쓴다며 코웃음을 쳐.","thought":"오디세우스는 칼을 뽑으려다 멈춰. 그러면 입구의 저 바위는 누가 치우냐고 따져 본 거야. 힘으로 맞붙기보다 빠져나갈 방법을 먼저 찾아. 그 사이 올리브 통나무를 뾰족하게 깎아 불에 그슬려 두기도 해.","action":"밤이 되자 오디세우스가 독한 포도주를 권해. 거인이 기분이 좋아져서 이름을 물어. 오디세우스는 이렇게 답해. '내 이름은 아무도야.' 이웃 거인들이 몰려와 누가 괴롭히냐고 물을 때도 답은 아무도였어. 이웃들은 병인 줄 알고 돌아가. 아침에 거인이 양을 내보낼 때, 오디세우스는 제일 큰 숫양의 털에 매달려 빠져나와.","after":"그런데 배를 띄우고 나서 오디세우스가 뒤돌아 거인을 조롱해. 부하들이 제발 그만하라고 매달리는데도 끝내 자기 이름을 외쳐. 거인은 하늘로 두 팔을 뻗어 포세이돈에게 빌어. 「가더라도 늦게, 혼자, 남의 배로 가게 해.」 이 한 줄이 남은 이야기의 줄거리가 돼. 이제 바다의 신이 적이야.","mirror":"막히면 돌아갈 길부터 찾는 편이라면 오디세우스와 닮았어. 상황을 읽고 말과 방법을 바꾸는 데 빠른 면이 있어. 다만 이겨 놓고 한마디를 더 보태고 싶은 마음도 닮았을 수 있어."},"햄릿":{"who":"햄릿은 셰익스피어의 『햄릿』에 나오는 덴마크의 왕자야. 아버지의 유령에게 삼촌에 대한 말을 들었고, 그게 사실인지 확인하고 싶어 해. 한 번 더 생각하고 움직이는 사람으로 그려져. 이 장면은 극단이 성에 온 날이야.","scene":"성에 떠돌이 극단이 도착해. 햄릿이 예전부터 알던 배우들이야. 반갑게 끌어안고 나서 햄릿이 단장을 구석으로 데려가. 오늘 밤 공연에 대사 몇 줄만 몰래 끼워 넣어 달라고 해. 고른 작품은 정원에서 잠든 왕 귀에 누가 독을 붓는 이야기야. 햄릿은 친구 호레이쇼한테 부탁해. '연극 도중에 삼촌 얼굴만 봐. 절대 눈 떼지 말고.' 막이 오르자 왕이 연극 제목이 뭐냐고 묻고, 햄릿은 그 자리에서 쥐덫이라고 새로 붙여.","thought":"햄릿은 유령의 말을 그대로 믿지 않아. 확인이 끝나기 전에는 쉽게 움직이지 않는 사람이야. 그래서 연극 한 편으로 삼촌의 반응을 떠보기로 해. 공연 내내 쉬지 않고 떠들며 왕에게는 그냥 옛날이야기일 뿐이라고 능청을 떨어.","action":"연극이 가장 아슬한 대목에 이르자 왕 클로디어스가 벌떡 일어나 '불을 켜라!' 하고 외쳐. 공연은 엉망이 되고 사람들이 우르르 흩어져. 햄릿이 외쳐. '이제 유령 말이라면 큰돈 걸고 믿겠어!' 그 뒤 엄마에게 가던 길에 햄릿이 삼촌의 뒷모습을 보고 다가갔다가 멈춰. 지금은 때가 아니라는 계산이었어.","after":"혼자 남은 클로디어스는 무릎을 꿇고 처음으로 자기 죄를 인정해. 그런데 왕관도 왕비도 내려놓기는 싫어. 반전은 이거야. 햄릿이 가고 나서 왕이 중얼거려. 「마음 없이 입으로만 한 기도는 하늘에 못 닿아.」 기도는 처음부터 헛돌고 있었던 거야. 이 장면은 햄릿이 정말 천국 계산 때문에 멈췄는지 질문하며 끝나.","mirror":"결정하기 전에 여러 번 곱씹어 보는 편이라면 햄릿과 닮았어. 확인이 끝나기 전에는 쉽게 움직이지 않는 면이 있을 수 있어. 드디어 기회가 왔는데 지금은 타이밍이 아니라며 넘긴 날이 떠오를 수도 있어."},"파우스트":{"who":"파우스트는 괴테의 『파우스트 1부』에 나오는 박사야. 아는 게 많은데도 더 알고 싶어 하는 사람이야. 이 장면에서 그는 자기 안에 영혼이 둘 산다고 털어놔. 하나는 땅에 착 붙어 있고, 하나는 하늘로 날아가려 한대.","scene":"부활절 오후야. 파우스트가 조수 바그너와 성문 밖으로 산책을 나가. 농부들이 박사님 오셨다고 술잔을 내밀어. 옛날에 파우스트 부자가 마을을 돌봐 줬거든. 근데 본인 속은 편치 않아. 해 질 무렵 들판에서 검은 푸들 한 마리가 둘 주위를 빙빙 돌아. 파우스트 눈엔 개 뒤로 불꽃이 따라붙는 것 같은데, 바그너는 그냥 주인 잃은 개래. 푸들은 서재까지 따라 들어와. 파우스트가 성경을 번역하는 동안 개가 낑낑대더니 하마만큼 부풀어.","thought":"파우스트는 뭘 가져도 배고픈 게 자기 장점이라고 믿어. 그래서 절대 만족하지 않을 자신이 있어. 푸들이 변한 악마 메피스토펠레스를 보고는 이렇게 말해. '하, 개 탈 쓰고 들어온 게 너였냐?' 호기심이 앞서는 사람이야.","action":"메피스토의 제안은 이래. 이승에서는 내가 네 하인, 저승에서는 네가 내 하인. 파우스트는 한술 더 떠서 내기를 걸어. 「이 순간 가지 말라고 매달리면, 그날 날 가져가.」 메피스토가 종이를 내밀자 파우스트는 말로 하면 됐지 꼭 문서가 있어야 하냐고 투덜대. 메피스토는 피 한 방울이면 된다고 해. 그렇게 서명이 끝나.","after":"계약이 끝나고 메피스토가 파우스트 가운을 걸치고 찾아온 신입생 상담을 대신해 줘. 책상 이론보다 살아 있는 인생이 훨씬 싱싱하다고 속삭이며 학생을 헷갈리게 해. 곧 두 사람은 메피스토의 망토를 타고 날아올라. 술 취한 대학생들의 소굴을 지나 마녀의 부엌에서 파우스트는 서른 살을 돌려받아.","mirror":"아는 게 늘수록 더 알고 싶어지는 편이라면 파우스트와 닮았어. 새로운 게 보이면 일단 가까이 가 보는 면이 있을 수 있어. 너는 절대 안 흔들린다고 큰소리쳤던 날도 떠오를 수 있어."},"단테(일상형)":{"who":"단테는 『신곡』을 쓴 이탈리아 시인이야. 『신곡』은 작가가 자기 자신을 주인공으로 넣은 이야기야. 길을 잃어도 일단 걷는 사람으로 그려져. 이 장면은 책의 맨 처음이야. 서른다섯 살의 단테가 캄캄한 숲에서 정신을 차리는 날이야.","scene":"1300년 봄, 부활절을 앞둔 밤이야. 한 남자가 정신을 차려 보니 캄캄한 숲 한가운데야. 어떻게 들어왔는지도 몰라. 그냥 너무 졸렸대. 이때 단테는 서른다섯이야. 성경은 사람 수명을 일흔으로 치거든. 딱 절반을 온 거야. 숲 끝에 언덕이 보이고 꼭대기엔 아침 해가 걸려 있어. 올라가려는데 얼룩 표범, 고개 쳐든 사자, 뼈만 남은 암늑대가 튀어나와. 늑대가 한 걸음씩 단테를 숲으로 밀어내.","thought":"책의 첫머리는 이런 뜻이야. 「반평생쯤 와서 보니 곧은 길은 없고 숲뿐이었다.」 단테는 딱 한 발만 더 가면 될 것 같은데 자꾸 뒤로 밀리는 때를 만난 거야. 그때 누군가가 보여서 소리쳐. '사람이든 유령이든 좀 살려 줘요!'","action":"상대는 로마에서 아이네이아스 이야기를 쓴 시인 베르길리우스야. 단테가 평생 외워 온 최애 시인이지. 베르길리우스는 저 늑대 앞으로는 아무도 못 지나가니 다른 길로 가야 한대. 그 길은 지옥 밑바닥까지 내려갔다가 산을 넘어 올라가는 길이야. 단테는 처음엔 따라나서지만, 해가 지니까 겁이 나서 발이 딱 멈춰. '내가 무슨 자격으로 거길 가요?'","after":"베르길리우스가 비밀 하나를 털어놔. 하늘에서 누가 내려와서 눈물까지 흘리며 단테를 부탁했대. 베아트리체야. 단테가 아홉 살 때 처음 보고 평생 사랑한 사람이고, 이미 10년 전에 세상을 떠났어. 길 잃은 단테를 붙잡은 건 설교가 아니라 사랑한 사람의 부탁이었어. 다음 장면은 커다란 문 앞에서 시작해.","mirror":"방향이 흐려져도 멈추지 않고 걸어가는 편이라면 단테와 닮았어. 길을 아는 사람의 안내를 잘 받아들이는 면이 있을 수 있어. 마음먹고 시작했는데 원래 자리에 서 있는 날도 한 번쯤 있었을 거야."},"그레고르 잠자":{"who":"그레고르 잠자는 카프카의 소설 『변신』의 주인공이야. 옷감을 파는 외판원이야. 지금으로 치면 매주 지방 출장을 다니는 영업사원이지. 말없이 책임지는 사람으로 그려져. 이 장면은 소설의 첫 아침이야.","scene":"어느 날 아침 그레고르가 눈을 떠. 등이 갑옷처럼 딱딱하고, 고개를 들어 보니 배는 갈색이고 마디마디로 나뉘어 있어. 가느다란 다리들이 눈앞에서 힘없이 버둥거려. 꿈이 아니야. 방은 그대로야. 책상 위엔 옷감 샘플이 펼쳐져 있고, 벽에는 잡지에서 오려낸 사진 액자가 걸려 있어. 모피 모자에 모피 목도리를 두른 여자 사진이야. 벌레의 방에 남은 사람 시절의 흔적이래.","thought":"자, 몸이 벌레가 됐어. 이 남자가 제일 먼저 하는 걱정이 뭘까? 왜 이렇게 됐지가 아니야. 기차야. 시계를 보니 여섯 시 반이고, 다섯 시 기차는 벌써 떠났어. 누워서 직업 욕부터 해. 맨날 새벽 기차, 아무 데서나 대충 먹는 밥. 그만두고 싶은데 못 그만둬. 아버지가 사장한테 진 빚을 5년째 갚고 있거든.","action":"그레고르는 일곱 시 기차라도 타야 하는데 몸이 안 움직여. 여섯 시 사십오 분, 엄마가 문을 두드려. '그레고르, 일곱 시 십오 분 전이야. 안 나가니?' 대답하는데 목소리에 찍찍거리는 소리가 섞여. 아빠는 옆문에서 '무슨 일이야?' 하고, 동생은 작게 '오빠, 어디 아파?' 하고 물어. 침대에서 내려오려고 몸을 흔들다 쿵 떨어지는 동안에도 기차 시간을 세고 있어.","after":"일곱 시가 넘자 회사에서 지배인이 직접 찾아와. 잠긴 문 너머로 그레고르가 입으로 열쇠를 돌려. 이 장면은 문이 열리면 어떻게 될까 하는 질문에서 끝나. 그다음은 다음 장면에서 이어져. ","mirror":"힘든 일이 생겨도 맡은 일부터 걱정하는 편이라면 그레고르와 닮았어. 속마음은 잘 안 꺼내고 조용히 버티는 면이 있을 수 있어. 몸이 아픈데도 출근 걱정부터 했던 날이 떠오를 수 있어."},"아킬레우스(일상형)":{"who":"아킬레우스는 『일리아스』에 나오는 그리스 최강의 전사야. 자존심이 먼저 반응하는 사람으로 그려져. 이 장면은 그가 총사령관 아가멤논에게 브리세이스를 빼앗기는 날이야. 브리세이스는 그가 전쟁에서 상으로 받은 사람이었어.","scene":"전령 둘이 해변을 따라 걸어와. 발걸음이 무거워. 아킬레우스의 막사 앞에 서서는 입도 못 떼. 브리세이스를 데려오라는 아가멤논의 명령을 들고 왔거든. 아킬레우스가 먼저 불러. '너희 잘못 아니야. 가까이 와.' 그리고 친구 파트로클로스한테 그녀를 데리고 나오라고 해. 칼은 안 뽑아. 대신 이 일을 모두가 똑똑히 봐 두라고 해. 브리세이스가 전령들을 따라 걸어가는데, 호메로스는 가기 싫었다고 딱 한 마디만 붙여.","thought":"아킬레우스는 동료들을 떠나 혼자 바닷가에 앉아. 끝없는 바다를 보면서 울어. 그리스 최강의 전사가 말이야. 그러다 두 팔을 뻗고 바닷속 어머니를 불러. 바다의 여신 테티스야. 서운함이 너무 커서, 서운하게 한 사람이 한번 크게 망신당했으면 하는 마음까지 가지게 돼.","action":"테티스가 안개처럼 물 위로 올라와 우는 아들 옆에 앉아 쓰다듬어. 아킬레우스는 사제 이야기부터 역병, 빼앗긴 브리세이스까지 처음부터 다 털어놔. 그리고 엄마에게 부탁해. 제우스에게 가서 전쟁의 흐름을 뒤집어 달래. 이번엔 자기 편이 밀리게 해 달라는 거야. 그래야 아가멤논이 누구를 무시했는지 뼈저리게 안다고.","after":"테티스가 올림포스로 올라가 제우스의 무릎을 붙잡고 턱을 받치며 빌어. 제우스가 한참 망설이다 고개를 끄덕이자 산 전체가 흔들려. 제우스는 약속을 지키려고 한밤중 아가멤논의 머리맡에 가짜 꿈을 보내. 오늘 싸우면 이긴다는 꿈이야. 이 장면은 이 끄덕임의 값을 누가 치르게 될지 묻고 끝나.","mirror":"인정받지 못하면 서운함이 오래가는 편이라면 아킬레우스와 닮았어. 마음이 정해지면 끝까지 밀어붙이는 면이 있을 수 있어. 서운하게 한 사람이 한 번쯤 혼났으면 하고 몰래 바란 적도 떠오를 수 있어."},"헥토르":{"who":"헥토르는 『일리아스』에서 트로이를 지키는 전사야. 가까운 사람부터 챙기는 사람으로 그려져. 이 장면은 전투 중에 잠깐 성안으로 들어온 날이야. 아내 안드로마케와 갓난아기 아들을 만나는 대목이야.","scene":"피 묻은 갑옷 그대로 헥토르가 트로이 성안으로 들어와. 어머니한테 신전에 제물을 올리라고 이르고, 파리스의 방에 들러 전장에 나오라고 한소리 하고, 드디어 자기 집 문을 열어. 그런데 아내가 없어. 하녀가 알려 줘. 트로이군이 밀린다는 소문을 듣고 안드로마케가 아기를 안고 성벽 망루로 뛰어갔대. 헥토르가 왔던 길을 되짚어 달려. 성문 앞에서 두 사람이 마주쳐. 유모 품에는 갓난 아들이 안겨 있어.","thought":"안드로마케가 남편 손을 잡고 울면서 제발 성벽 안에서 싸워 달라고 해. 헥토르도 다 알아. 그런데 뒤로 숨으면 트로이 사람들 얼굴을 못 본대. 늘 앞줄에서 싸우라고 배우며 컸대. 가족이 걱정이지만 맡은 자리를 접을 수는 없는 사람이야.","action":"헥토르가 아들에게 팔을 뻗자 아기가 으앙 울면서 유모 품으로 파고들어. 청동 투구 꼭대기에서 말총 장식이 흔들리는 게 무서웠던 거야. 헥토르와 안드로마케가 그만 웃음을 터뜨려. 헥토르가 투구를 벗어 땅에 내려놓고 아기를 번쩍 안아. 아기에게 입 맞추고 신들에게 빌어. 이 아이가 아빠보다 더 나은 사람이 되게 해 달라고.","after":"아기를 받아 든 안드로마케가 눈물 젖은 얼굴로 웃어. 헥토르가 아내를 쓰다듬으며 달래. 「정해진 날이 오기 전엔 아무도 날 못 데려가.」 그러고는 투구를 다시 써. 안드로마케는 집으로 가면서 자꾸 뒤를 돌아봐. 이 장면 이후의 전세는 다음 장면에서 이어져.","mirror":"가까운 사람의 일을 네 일처럼 챙기는 편이라면 헥토르와 닮았어. 해야 할 일 앞에서는 망설임을 접는 면이 있을 수 있어. 늘 강해 보이던 사람이 잠깐 무장을 풀고 그냥 가족 얼굴이 되던 순간도 떠오를 수 있어."}};
const RTK={'엘리자베스':'엘리자베스(일상형)','단테':'단테(일상형)','아킬레우스':'아킬레우스(일상형)'};
const chunk=t=>{const ss=(t||'').split(/(?<=[.?!」])\s+/).filter(Boolean);const out=[];for(let i=0;i<ss.length;i+=3)out.push(ss.slice(i,i+3).join(' '));return out};
const PORT={"엘리자베스": {"src": "/quiz/p/elizabeth.jpg", "pos": "50% 40%", "cap": ""}, "오디세우스": {"src": "/quiz/p/odysseus.jpg", "pos": "50% 40%", "cap": ""}, "햄릿": {"src": "/quiz/p/hamlet.jpg", "pos": "50% 40%", "cap": ""}, "파우스트": {"src": "/quiz/p/faust.jpg", "pos": "50% 40%", "cap": ""}, "단테": {"src": "/quiz/p/dante.jpg", "pos": "50% 40%", "cap": ""}, "그레고르 잠자": {"src": "/quiz/p/gregor.jpg", "pos": "50% 40%", "cap": ""}, "아킬레우스": {"src": "/quiz/p/achilles.jpg", "pos": "50% 40%", "cap": ""}, "헥토르": {"src": "/quiz/p/hector.jpg", "pos": "50% 40%", "cap": ""}, "코딜리아": {"src": "/quiz/p/cordelia.jpg", "pos": "50% 40%", "cap": ""}, "페넬로페": {"src": "/quiz/p/penelope.jpg", "pos": "50% 40%", "cap": ""}, "에픽테토스": {"src": "/quiz/p/epictetus.jpg", "pos": "50% 40%", "cap": ""}, "마르쿠스 아우렐리우스": {"src": "/quiz/p/marcus.jpg", "pos": "50% 40%", "cap": ""}, "다아시": {"src": "/quiz/p/darcy.jpg", "pos": "50% 40%", "cap": ""}, "텔레마코스": {"src": "/quiz/p/telemachus.jpg", "pos": "50% 40%", "cap": ""}, "라파엘 히슬로다이": {"src": "/quiz/p/raphael.jpg", "pos": "50% 40%", "cap": ""}, "세네카": {"src": "/quiz/p/seneca.jpg", "pos": "50% 40%", "cap": ""}};

function pick(){const s=Array(C.length).fill(0);let last=null;DQ.forEach(q=>{const w=q.w[st.a[q.k]];w.forEach(([c,v])=>s[XI[c]]+=v);last=w});
 const mx=Math.max(...s);const cand=s.map((v,i)=>v==mx?i:-1).filter(i=>i>=0);
 const f=i=>(last.find(([c])=>XI[c]==i)||[0,0])[1];cand.sort((a,b)=>f(b)-f(a)||a-b);return C[cand[0]]}
function result(direct){st.view='result';st.direct=!!direct;const a=st.a;const nm=direct||pick(),r=D[nm];const name=nm,book=r.b,sc=r.sc;
 const ci=C.indexOf(nm),pts=direct?[]:DQ.map(q=>({q,w:(q.w[a[q.k]].find(([c])=>XI[c]==ci)||[0,0])[1],i:a[q.k]})).filter(x=>x.w>0).sort((x,y)=>y.w-x.w).slice(0,3);
 const meta=pts.map(x=>[x.q.t.replace(/[?,].*$/,'').replace(/, 나는$/,''),x.q.o[x.i]]);
 const g=direct?0:Object.keys(a).reduce((n,k)=>n+(a[k]%2),0)%2;
 const sumLine=WHO2[name]||'';
 const X=RT[RTK[name]||name]||{};
 const mir=r.nm?[]:(X.mirror?chunk(X.mirror):[]);
 const secs=[["이 사람은 누구야?",X.who?chunk(X.who):[WHO2[name]||""]],["어떤 일이 있었냐면",X.scene?chunk(X.scene):[r.sc+"."]],["그때 이렇게 생각하고 이렇게 했어",X.thought?[...chunk(X.thought),...chunk(X.action)]:[]],["그 뒤엔 이렇게 됐어",X.after?chunk(X.after):[]],["너랑 닮은 점",[r.g[g],r.g[1-g],...mir]]];
 st.res={name,book,sc};
 const pt=PORT[name];const por=`<div class="prof"><div class="avatar" aria-hidden="true">${pt?`<img src="${pt.src}" alt="" style="object-position:${pt.pos||'50% 22%'}">`:`<span>${esc(name.trim().charAt(0))}</span>`}</div><div class="pwho"><h1 class="rt">${esc(name)}</h1><p class="rbook">『${esc(book)}』 속 인물</p></div></div>${pt&&pt.cap?`<p class="pcap">${esc(pt.cap)}</p>`:''}`;
 const card=`<section class="shcard" aria-label="공유 카드"><div class="shrow"><div class="avatar sm" aria-hidden="true">${pt?`<img src="${pt.src}" alt="" style="object-position:${pt.pos||'50% 22%'}">`:''}</div><div><p class="shn">${esc(name)}</p><p class="shb">『${esc(book)}』 속 인물</p></div></div><p class="shl">${esc(r.nick)}</p><p class="shf">코스미(Cosmii)</p></section><p class="shprev"><b>공유 문구</b><br>${esc(name)} — 『${esc(book)}』 속 인물<br>${esc(r.nick)}<br><br>고전 속에서 나와 닮은 사람 찾기<br>${esc(location.origin)}/quiz/r/${SLUG[name]}</p><button class="btn sec" id="share">공유하기</button>`;
 app.innerHTML=head(direct?0:NT(),direct?0:NT())+`<article class="slide res rep"><p class="kick">${direct?'고전 속 인물':'분석 리포트'}</p>${por}
 <p class="rsum">${esc(sumLine)}</p>
 ${meta.length?`<section class="rmeta" aria-label="분석 기준"><h3>이 답이 크게 닮았어</h3><dl>${meta.map(m=>`<div><dt>${esc(m[0])}</dt><dd>${esc(m[1])}</dd></div>`).join('')}</dl></section>`:''}
 ${secs.filter(x=>x[1].length).map((x,i)=>`<section class="rsec"><span class="part">PART ${i+1}</span><h3>${esc(x[0])}</h3>${x[1].map(t=>`<p>${esc(t)}</p>`).join('')}</section>`).join('')}
 <section class="rsec last"><span class="part">PART ${secs.filter(x=>x[1].length).length+1}</span><h3>직접 읽어 보면 더 와닿아</h3><p>이 사람이 어떤 말을 했고 어떻게 움직였는지, 쉬운 말로 이어 읽으면 훨씬 잘 보여. 장면은 「${esc(sc)}」야.</p></section>
 ${card}
 <button class="btn" id="open">이 장면 무료로 읽어 보기</button><p class="scn">${esc(sc)}</p>
 <button class="btn sec" id="again">${direct?'나도 해 보기':'다시 하기'}</button>
 <p class="note">${(st.noMail||direct)?'':'같은 내용을 이메일로도 보내 드려요(시안은 발송하지 않아요). '}재미로 보는 퀴즈야. 심리검사는 아니야. Cosmii는 고전을 읽는 가장 쉬운 방법이야.</p>
 <p class="proto">시안 화면이에요. 수집 안내 문구는 법 검토 전 초안이고, 이메일은 저장·발송하지 않아요.</p></article>`;
 document.getElementById('open').onclick=()=>toast("실제 화면에서는 「"+sc+"」 읽기 링크로 이어져요");
 document.getElementById('share').onclick=async()=>{const url=location.origin+'/quiz/r/'+SLUG[name]+'?ct=quiz_share';const text=name+' — 『'+book+'』 속 인물\n'+r.nick+'\n\n고전 속에서 나와 닮은 사람 찾기';try{if(navigator.share){await navigator.share({text,url});return}}catch(e){if(e&&e.name==='AbortError')return}try{await navigator.clipboard.writeText(text+'\n'+url);toast('링크를 복사했어')}catch(e){toast(url)}};
 if(direct)document.getElementById('bk').hidden=true;
 document.getElementById('again').onclick=()=>{if(st.direct){location.href='/quiz';return}start()};window.scrollTo(0,0)}

let tt;function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24"><path d="M12 0 C12.6 7 17 11.4 24 12 C17 12.6 12.6 17 12 24 C11.4 17 7 12.6 0 12 C7 11.4 11.4 7 12 0 Z"/></svg><span></span>';d.lastChild.textContent=m;document.body.appendChild(d);clearTimeout(tt);tt=setTimeout(()=>d.remove(),3200)}
new MutationObserver(()=>{const a=document.activeElement;if(a&&a!==document.body)a.blur();app.classList.add('fresh');clearTimeout(window.__fr);window.__fr=setTimeout(()=>app.classList.remove('fresh'),350)}).observe(app,{childList:true});
app.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;if(b.dataset.go)return;e.stopImmediatePropagation();e.preventDefault();b.classList.add('picked');app.classList.add('picking');setTimeout(()=>{b.dataset.go='1';app.classList.remove('picking');b.click()},330)},true);
document.getElementById('bk').onclick=back;
if(DIRECT&&D[DIRECT]){st={a:{},i:0,view:'result'};result(DIRECT)}else start();
</script>
</body></html>
